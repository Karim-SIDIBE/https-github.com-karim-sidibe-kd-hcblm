name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: declick
          POSTGRES_PASSWORD: declick
          POSTGRES_DB: kd_hcblm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U declick -d kd_hcblm"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://declick:declick@localhost:5432/kd_hcblm?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm -w server exec prisma generate
      - name: Typecheck (all workspaces)
        run: npm run typecheck
      - name: Apply migrations
        run: npm -w server exec prisma migrate deploy
      - name: Test (shared · server · web)
        run: |
          touch server/.env
          npm test
      - name: Build PWA
        run: npm -w web run build
        env:
          VITE_API_URL: https://api.declick.digital/api/v1

  # Dé-risquage (ADR 0001/0003) : vulnérabilités de dépendances. BLOQUANT
  # depuis la purge du 30/10/2026 (0 vulnérabilité de production) : échoue si
  # une vulnérabilité high/critical touche les dépendances de production.
  # Les niveaux low/moderate restent visibles dans le journal sans bloquer.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (prod dependencies)
        run: npm audit --omit=dev --audit-level=high
