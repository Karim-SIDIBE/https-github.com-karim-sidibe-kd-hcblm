# Filtre fail2ban — abus qualifiés sur les journaux d'accès JSON de Caddy :
# 401 (authentification refusée), 403 (interdit), 429 (rate-limit dépassé).
# Une IP qui les accumule cherche un accès qu'elle n'a pas (brute-force, scan).
[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"status":(?:401|403|429)
ignoreregex =
